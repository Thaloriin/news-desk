<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>全球新闻台 · 每日精选</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="mark"></span>
      <div>
        <h1>全球新闻台</h1>
        <p id="sub">每日抓取 · 分类 · 按重要性排序</p>
      </div>
    </div>
    <div class="controls">
      <select id="day"></select>
      <button id="digestBtn" class="digest-btn" title="让 AI 总结当前筛选的这批新闻">AI 总结</button>
      <button id="refresh" data-live-only title="立即抓取">抓取</button>
      <a class="admin-btn" data-live-only href="admin.html" title="工作台：AI 配置、数据源、抓取">工作台</a>
    </div>
  </div>
</header>

<nav class="tabs wrap" id="tabs"></nav>
<nav class="facets wrap" id="countries"></nav>
<nav class="facets wrap" id="topics"></nav>

<section id="digestPanel" class="digest-panel wrap" hidden></section>

<main class="wrap">
  <div class="bar">
    <span id="count">—</span>
    <span id="engine" class="engine"></span>
  </div>
  <ol id="list" class="list"></ol>
  <p id="empty" class="empty" hidden>这一天还没有数据。点右上角「抓取」。</p>
</main>

<footer class="wrap foot">
  <span>只存标题、摘要与链接，不转载正文。点击标题打开原文对照。</span>
  <span id="srcs"></span>
</footer>

<!-- 全屏阅读：左原文 右译文 -->
<div class="reader" id="reader" hidden>
  <div class="reader-bar">
    <span id="rMeta" class="reader-meta"></span>
    <span class="spacer"></span>
    <label class="reader-toggle" data-live-only title="打开新闻时自动翻译"><input type="checkbox" id="autoToggle" /> 自动翻译</label>
    <button id="btnTranslate">翻译成中文</button>
    <a id="rLink" class="reader-link" target="_blank" rel="noopener">原文 ↗</a>
    <button id="rClose" class="ghost">关闭</button>
  </div>
  <div class="reader-body">
    <div class="reader-inner">
      <h1 class="en-title" id="enTitle"></h1>
      <p class="zh-title" id="zhTitle"></p>
      <div id="rBlocks"></div>
      <p id="zHint" class="zh-hint"></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

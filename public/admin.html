<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工作台 · 全球新闻台</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin:18px 0}
  .panel h3{margin:0 0 4px;font-size:14px;color:var(--green)}
  .panel .hint{margin:0 0 14px;font-size:11.5px;color:var(--muted)}
  .field{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted)}
  .field input[type=text],.field input[type=password]{
    font-family:inherit;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;width:100%
  }
  .row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .msg{font-size:12px;margin-left:4px}
  .ok{color:#2f6b46}
  .err{color:#a33}
  .switch-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink);cursor:pointer}
  .switch-row input{width:16px;height:16px;accent-color:#1E3A34;cursor:pointer}
  .switch-row span{color:var(--muted);font-size:11.5px}
  .feeds{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
  .feed{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0}
  .feed small{color:var(--muted)}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .stat{border:1px solid var(--line);border-radius:4px;padding:10px 12px}
  .stat b{display:block;font-size:19px;color:var(--green)}
  .stat span{font-size:11px;color:var(--muted)}
  .back{font-size:12px;color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="mark"></span>
      <div>
        <h1>工作台</h1>
        <p id="sub">AI 配置 · 数据源 · 抓取 · 统计</p>
      </div>
    </div>
    <div class="controls">
      <a class="back" href="/">← 返回新闻台</a>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:8px">

  <section class="panel">
    <h3>AI 打分</h3>
    <p class="hint">填任意 OpenAI 兼容接口。改完即时生效，不用重启。Key 只存在本机 data/config.json，前端只显示打码值。</p>
    <div class="field"><label>接口地址</label><input id="baseUrl" type="text" placeholder="https://api.deepseek.com/v1" /></div>
    <div class="field"><label>模型名</label><input id="model" type="text" placeholder="deepseek-chat" /></div>
    <div class="field"><label>API Key</label><input id="key" type="password" placeholder="留空表示不修改" /></div>
    <div class="field">
      <label>自动翻译</label>
      <label class="switch-row">
        <input type="checkbox" id="autoTranslate" />
        <span>打开新闻时自动翻译并逐句对照（每条会消耗一次模型调用）</span>
      </label>
    </div>
    <div class="row">
      <button id="saveApi">保存</button>
      <button id="testApi" style="background:#fff;color:var(--green);border-color:var(--green)">测试连接</button>
      <span id="apiMsg" class="msg"></span>
    </div>
    <p class="hint" id="keyNow" style="margin-top:10px"></p>
  </section>

  <section class="panel">
    <h3>数据源</h3>
    <p class="hint">取消勾选后，下次抓取会跳过该源。</p>
    <div class="feeds" id="feeds"></div>
    <div class="row"><button id="saveFeeds">保存数据源</button><span id="feedMsg" class="msg"></span></div>
  </section>

  <section class="panel">
    <h3>抓取</h3>
    <p class="hint">立即抓取一轮。耗时约 5 秒，结果会写入数据库并刷新首页。</p>
    <div class="row"><button id="collect">立即抓取</button><span id="collectMsg" class="msg"></span></div>
  </section>

  <section class="panel">
    <h3>统计</h3>
    <div class="stat-grid" id="stats"></div>
    <p class="hint" id="catBreak" style="margin-top:12px"></p>
    <p class="hint" id="tokenLine"></p>
  </section>

</main>

<script src="/admin.js"></script>
</body>
</html>
